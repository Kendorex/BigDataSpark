name: bigdata-spark-lab2

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: lab_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data:/data:ro
      - ./sql/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d lab_db"]
      interval: 5s
      timeout: 5s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: lab
      CLICKHOUSE_PASSWORD: lab
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "lab", "--password", "lab", "--database", "analytics", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  mongodb:
    image: mongo:8.0
    profiles: ["mongodb"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: lab
      MONGO_INITDB_ROOT_PASSWORD: lab
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./mongo:/checks:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--username", "lab", "--password", "lab", "--authenticationDatabase", "admin", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 30

  spark:
    build: ./spark
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      PG_HOST: postgres
      PG_DATABASE: lab_db
      PG_USER: postgres
      PG_PASSWORD: postgres
      CH_URL: http://clickhouse:8123
      CH_DATABASE: analytics
      CH_USER: lab
      CH_PASSWORD: lab
      MONGO_URI: mongodb://lab:lab@mongodb:27017/?authSource=admin
      MONGO_DATABASE: analytics
      SPARK_LOCAL_IP: 0.0.0.0
      PYSPARK_PYTHON: python3
    volumes:
      - ./spark/jobs:/app:ro
      - ./sql:/sql:ro
      - ./tests:/tests:ro
      - ./data:/data:ro
    working_dir: /app
    entrypoint: ["/opt/spark/bin/spark-submit", "--master", "local[2]", "--driver-memory", "1g", "--jars", "/opt/spark/jars/postgresql.jar", "/app/main.py"]
    command: ["all"]

volumes:
  postgres_data:
  clickhouse_data:
  mongodb_data:
